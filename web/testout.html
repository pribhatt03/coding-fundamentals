<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test out</title>
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<link rel="stylesheet" href="./course.css">
<style>
  /* Test-out page only. Built from the same variables as the course. */
  .testout { max-width: 44rem; margin: 0 auto 4rem; padding: 0 1.25rem; }
  /* A bar that stays at the top while scrolling, holding the panel buttons. */
  .testout .tbar { position: sticky; top: 0; z-index: 5; display: flex; justify-content: space-between;
    align-items: center; gap: 1rem; padding: .7rem 0; background: var(--paper);
    border-bottom: 1px solid var(--rule); font-size: .88rem; }
  .testout .tbar #tools { display: flex; gap: 1.1rem; }
  .testout .tbtn[aria-pressed="true"] { font-weight: 600; }
  .testout .skipnote { font-size: .88rem; font-style: italic; margin: 0 0 .5rem; }
  /* Wide screens: the open panel sits beside the questions rather than over them. */
  @media (min-width: 1100px) {
    body.panel-open .testout { margin-left: max(1.25rem, calc((100vw - min(34rem, 100vw) - 44rem) / 2));
      margin-right: calc(min(34rem, 100vw) + 1rem); }
  }
  .testout h1 { font-size: 1.9rem; margin: 1rem 0 .4rem; }
  .testout .lead { font-size: 1.05rem; }
  .testout .crib { border: 1px solid var(--rule); border-radius: 6px; padding: .9rem 1.1rem; margin: 1.4rem 0; font-size: .92rem; }
  .testout .crib h2 { font-size: 1rem; margin: 0 0 .4rem; }
  .testout .context { margin: 1.2rem 0; }
  .testout .context h2 { font-size: 1rem; margin: 0 0 .3rem; }
  .testout .context pre { overflow-x: auto; }
  .testout .startrow { display: flex; gap: .9rem; align-items: center; flex-wrap: wrap; margin-top: 1.6rem; }
  .testout .sub { font-size: .85rem; opacity: .75; }
  .testout .tq { border-top: 1px solid var(--rule); padding: 1.2rem 0 1.4rem; }
  .testout .tq h3 { font-size: 1.05rem; margin: 0 0 .4rem; }
  .testout .tq-options { display: grid; gap: .45rem; margin: .7rem 0; }
  .testout .tq-opt { text-align: left; font: inherit; font-size: .95rem; padding: .55rem .8rem; border: 1px solid var(--rule); border-radius: 5px; background: transparent; color: inherit; cursor: pointer; }
  .testout .tq-opt:hover:not(:disabled) { border-color: currentColor; }
  .testout .tq-opt:disabled { cursor: default; }
  .testout .tq-opt.correct { border-color: #2e7d4f; box-shadow: inset 3px 0 0 #2e7d4f; }
  .testout .tq-opt.picked:not(.correct) { border-color: #b3261e; box-shadow: inset 3px 0 0 #b3261e; }
  .testout .tq-fb { font-size: .95rem; }
  .testout .tq-fb .verdict { font-weight: 600; margin-bottom: .2rem; }
  .testout .tq-fb .verdict.pass { color: #2e7d4f; }
  .testout .tq-fb .verdict.fail { color: #b3261e; }
  .testout .result { border: 1px solid var(--rule); border-radius: 6px; padding: 1.1rem 1.3rem; margin-top: 1.6rem; }
  .testout .result.pass h2 { color: #2e7d4f; }
  .testout .result.fail h2 { color: #b3261e; }
  .testout .revisit { margin: .3rem 0 1rem 1.2rem; }
  .testout .act-link { font-weight: 600; }
  .testout .testout-note { font-size: 1rem; }
  /* Code in a question reads at the same size as the answers below it. */
  .testout .prompt pre { font-size: .92rem; }
  /* In a side panel, R's printouts fit the panel's width without scrolling. */
  .sidepanel .panelbody pre { font-size: .7rem; padding: .8rem .9rem; }
</style>
</head>
<body class="reading">
  <main class="testout">
    <nav class="tbar">
      <a id="back" href="./index.html">&larr; Back to the course</a>
      <span id="tools"></span>
    </nav>
    <div id="test"></div>
  </main>
  <script type="module" src="./theme.js"></script>
  <script type="module" src="./testout.js"></script>
</body>
</html>
