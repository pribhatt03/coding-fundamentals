<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise test harness</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.55 ui-sans-serif, system-ui, sans-serif; margin: 0; }
  .wrap { display: grid; grid-template-columns: 15rem 1fr; min-height: 100vh; }
  nav { border-right: 1px solid #8883; padding: 1rem; overflow-y: auto; }
  nav h2 { font-size: .7rem; letter-spacing: .04em; color: #888; margin: 1rem 0 .4rem; }
  nav h2:first-child { margin-top: 0; }
  nav button {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    font: inherit; font-size: .82rem; padding: .3rem .4rem; border-radius: 4px;
    color: inherit; cursor: pointer;
  }
  nav button:hover { background: #8882; }
  nav button[aria-current="true"] { background: #8883; font-weight: 600; }
  nav .kind { color: #888; font-size: .72rem; }
  main { padding: 1.75rem 2rem; max-width: 62ch; }
  #status { font-size: .8rem; color: #888; margin-bottom: 1rem; }
  h1 { font-size: 1.05rem; margin: 0 0 .2rem; }
  .meta { font-size: .78rem; color: #888; margin: 0 0 1.25rem; }
  pre, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .prompt code { background: #8882; padding: .08em .3em; border-radius: 3px; font-size: .9em; }
  .prompt pre { background: #8881; padding: .7rem; border-radius: 5px; overflow-x: auto; }
  .prompt pre code { background: none; padding: 0; }
  label.opt {
    display: block; border: 1px solid #8884; border-radius: 6px;
    padding: .55rem .7rem; margin-bottom: .45rem; cursor: pointer;
  }
  label.opt:hover { border-color: #888; }
  label.opt input { margin-right: .5rem; }
  .spancode {
    background: #8881; padding: .8rem; border-radius: 5px; white-space: pre-wrap;
    font-size: .9rem; line-height: 1.9;
  }
  .spancode .sel {
    background: #8883; border-radius: 3px; padding: .15em .25em; cursor: pointer;
  }
  .spancode .sel:hover { background: #8885; outline: 1px solid #888; }
  .spancode .sel.picked { outline: 2px solid currentColor; }
  textarea {
    width: 100%; min-height: 6rem; padding: .6rem; border: 1px solid #8886;
    border-radius: 5px; background: transparent; color: inherit;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  button.act {
    font: inherit; padding: .4rem 1rem; border: 1px solid currentColor;
    border-radius: 5px; background: transparent; color: inherit; cursor: pointer;
  }
  button.act:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: .5rem; align-items: center; margin-top: .7rem; }
  .fb { margin-top: 1rem; padding: .8rem 1rem; border-radius: 6px; border-left: 3px solid; }
  .fb.pass { border-color: #1b7f3b; background: #1b7f3b18; }
  .fb.fail { border-color: #b3261e; background: #b3261e18; }
  .fb .verdict { font-weight: 600; margin-bottom: .35rem; }
  .fb pre { font-size: .78rem; color: #888; margin: .6rem 0 0; white-space: pre-wrap; }
  details { margin-top: 1rem; font-size: .85rem; color: #888; }
  details pre { background: #8881; padding: .6rem; border-radius: 5px; overflow-x: auto; }
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav"></nav>
  <main>
    <div id="status">loading…</div>
    <div id="ex"></div>
  </main>
</div>
<script type="module" src="./test.js"></script>
</body>
</html>
