<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise test harness</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/r/r.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./course.css">
<script type="module" src="./theme.js"></script>
<style>
  html, body { height: 100%; }
  body {
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 15px; line-height: 1.55; color: var(--ink);
    margin: 0; overflow: hidden; background: var(--paper);
  }
  .wrap { display: grid; grid-template-columns: 15rem 1fr; height: 100vh; }
  nav {
    border-right: 1px solid var(--rule); padding: 1rem;
    overflow-y: auto; height: 100vh; background: var(--paper-sunk);
  }
  nav h2 { font-size: .74rem; color: var(--ink-soft); margin: 1.3rem 0 .4rem; font-weight: 500; }
  nav h2:first-child { margin-top: 0; }
  nav h2 a { float: right; opacity: .7; color: inherit; }
  nav button {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    font: inherit; font-size: .8rem; padding: .32rem .45rem; border-radius: 3px;
    color: inherit; cursor: pointer;
  }
  nav button:hover { background: var(--paper); }
  nav button[aria-current="true"] { background: var(--paper); font-weight: 500; }
  nav .kind { color: var(--ink-soft); font-size: .7rem; font-family: "IBM Plex Mono", monospace; }
  main { padding: 2rem 2.5rem; overflow-y: auto; height: 100vh; }
  main > * { max-width: 42rem; }
  #status { font-size: .78rem; color: var(--ink-soft); margin-bottom: 1.5rem; }
  .exercise { border-left: 0; padding: 0; margin: 0; }
  details { margin-top: 2rem; font-size: .8rem; color: var(--ink-soft); }
  details summary { cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <nav id="nav"></nav>
  <main>
    <div id="status">loading…</div>
    <span id="fnslot"></span> <span id="themeslot"></span>
    <div id="ex"></div>
  </main>
</div>
<script type="module" src="./test.js"></script>
</body>
</html>
