<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter preview</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/r/r.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./course.css">
<script type="module" src="./theme.js"></script>
</head>
<body class="reading">
  <header class="bar">
    <select id="chapter"></select>
    <span id="count"></span>
    <span id="status"></span>
    <span id="warn"></span>
    <span id="fnslot"></span>
    <span id="themeslot"></span>
    <button id="events" class="linky">event log</button>
    <button id="reset" class="linky">reset progress</button>
    <a href="./test.html">harness</a>
  </header>
  <div class="bar-track"><div id="bar-fill"></div></div>
  <main id="chapter-body"></main>
  <script type="module" src="./chapter.js"></script>
</body>
</html>
