<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chapter preview</title>
<link rel="stylesheet" href="./vendor/codemirror/lib/codemirror.css">
<script src="./vendor/codemirror/lib/codemirror.js"></script>
<script src="./vendor/codemirror/mode/r/r.js"></script>
<script src="./vendor/codemirror/addon/edit/matchbrackets.js"></script>
<link rel="stylesheet" href="./vendor/fonts/fonts.css">
<link rel="stylesheet" href="./course.css">
<script type="module" src="./theme.js"></script>
</head>
<body class="reading">
  <div class="topbar">
    <header class="bar">
      <select id="chapter"></select>
      <span id="count"></span>
      <span id="status"></span>
      <span id="warn"></span>
      <span id="devtools" hidden>
        <button id="events" class="linky">event log</button>
        <a href="./test.html">harness</a>
      </span>
      <button id="reset" class="linky">reset progress</button>
      <span id="dataslot"></span>
      <span id="fnslot"></span>
      <span id="offlineslot"></span>
      <span id="themeslot"></span>
    </header>
    <div class="bar-track"><div id="bar-fill"></div></div>
  </div>
  <main id="chapter-body"></main>
  <script type="module" src="./chapter.js"></script>
</body>
</html>
