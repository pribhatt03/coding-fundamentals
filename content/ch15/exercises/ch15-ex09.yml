# yaml-language-server: $schema=../../../schema/exercise.schema.json
schema_version: 1
id: ch15-ex09
type: predict
title: Telling it the answer
topic: prompting
difficulty: 2
tags: [prompting, ai, sanity-check, critical-appraisal]
follows: ch15-ex03

prompt: |
  Before asking an AI to label each patient's blood pressure, you've thought
  of two quick checks — neither of them redoing the work:

  - Patient 2, at 152/94, must come out as "high".
  - The labels should add up to all six patients.

  Should you put the first one in your prompt — *"Patient 2 should come out
  as high"*?

hint: |
  A check works because it's independent of the thing it checks. Would it
  still be?

response:
  kind: choice
  select: one
  shuffle: true
  options:
    - id: keep
      text: "No — keep it to yourself, and compare it with what the code prints"
      correct: true
      feedback: |
        Right. A check only works if it's independent of what it's checking.
        If the AI knows the answer you expect, it may write code that reaches
        that answer rather than the right one — and then a match tells you
        nothing.

        So the check stays yours — and it isn't redoing R's work. It's a quick
        spot-check: do the counts add up to the total? Does one patient you
        know land where they should? Is the number plausible? Work it out
        however suits you — pen and paper, or a few throwaway lines in the
        console — ideally before you see the AI's result, so it can't nudge
        you.

        Having the code print a count is fine, whether the AI writes that line
        or you type it into the console yourself: R computes it. What isn't a
        check is the AI *telling* you the result is right.
    - id: helps
      text: "Yes — it helps the AI get the right answer"
      feedback: |
        It helps the AI get *your* answer, which isn't the same thing. If the
        AI bends the code to match it, patient 2 comes out right and nothing
        looks amiss — even if everyone else is wrong. Keep the checks to
        yourself and look afterwards.
    - id: selfcheck
      text: "Yes — then the AI can check its own work"
      feedback: |
        An AI writing code in a chat hasn't run it on your data. When it says
        "this gives three", it's predicting, not checking — and it can be
        confidently wrong. Even an AI tool that runs code can't see your real
        data, so it would be checking against its own guess of what your data
        looks like.
