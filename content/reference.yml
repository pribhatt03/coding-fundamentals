# Function reference — the course's own help page.
#
# One entry per function a student is shown. `introduced` is the chapter
# where it first appears; the panel only lists functions up to the chapter
# the student is reading, so nothing ahead gets spoiled.
#
# Write `does` in the words a beginner would search with. Someone looking
# for sum() types "count" or "add up", not "summation".
#
# The build warns when an exercise solution uses a function missing from
# here — that's the show-first rule, enforced.
#
# `note_from` hides a note until that chapter. Use it when the note would
# spoil an exercise whose whole point is the surprise: log() defaulting to
# base e, round(0.5) being 0. Don't gate lookups that are the intended path
# — ch05-ex06 is *meant* to be solvable by finding sum() here.

- name: round
  usage: round(x, digits = 0)
  does: Rounds a number to a given number of decimal places.
  example: round(93.333, 1)
  result: "[1] 93.3"
  introduced: ch02
  note: Halves round to the nearest even number, so `round(0.5)` is 0 and `round(1.5)` is 2.
  note_from: ch05

- name: class
  usage: class(x)
  does: Tells you what type of value something is — numeric, character, logical. The first thing to check when a function gives you something odd.
  example: class("142")
  result: '[1] "character"'
  introduced: ch03

- name: log
  usage: log(x, base = exp(1))
  does: Calculates a logarithm.
  example: log(100, base = 10)
  result: "[1] 2"
  introduced: ch04
  note: The default base is *e*, about 2.718 — not 10. `log(100)` is about 4.61.
  note_from: ch05

- name: paste
  usage: paste(..., sep = " ")
  does: Joins values together into one piece of text.
  example: 'paste("MAP is", 93.33, sep = ": ")'
  result: '[1] "MAP is: 93.33"'
  introduced: ch04

- name: c
  usage: c(...)
  does: Combines several values into one vector. Short for combine.
  example: c(118, 142, 131, 156)
  result: "[1] 118 142 131 156"
  introduced: ch05
  note: A vector holds one type only. If any value is text, every value becomes text.

- name: length
  usage: length(x)
  does: Counts how many values there are.
  example: length(c(118, 142, 131, 156))
  result: "[1] 4"
  introduced: ch05

- name: sum
  usage: sum(x)
  does: Adds up numbers. On TRUE and FALSE, counts how many are TRUE.
  example: sum(c(118, 142, 131, 156) > 140)
  result: "[1] 2"
  introduced: ch05

- name: mean
  usage: mean(x, na.rm = FALSE)
  does: The average. On TRUE and FALSE, gives the fraction that are TRUE.
  example: mean(c(118, 142, 131, 156))
  result: "[1] 136.75"
  also:
    - example: mean(c(TRUE, FALSE, TRUE, TRUE))
      result: "[1] 0.75"
  introduced: ch05
  note: Needs numbers. On text it warns and returns `NA`.

- name: max
  usage: max(x)
  does: The largest value.
  example: max(c(118, 142, 131, 156))
  result: "[1] 156"
  introduced: ch05

- name: sort
  usage: sort(x, decreasing = FALSE)
  does: Puts values in order, lowest first unless told otherwise.
  example: sort(c(142, 118, 156), decreasing = TRUE)
  result: "[1] 156 142 118"
  introduced: ch05

- name: as.numeric
  usage: as.numeric(x)
  does: Converts text into numbers.
  example: as.numeric("131")
  result: "[1] 131"
  introduced: ch05
  note: Anything that can't be read as a number becomes `NA`, with a warning.

- name: is.na
  usage: is.na(x)
  does: Finds missing values. Gives TRUE for each missing value and FALSE for everything else. The only reliable way to ask what's missing — `== NA` does not work.
  example: is.na(c(118, NA, 131))
  result: "[1] FALSE  TRUE FALSE"
  introduced: ch06
  note: Count missing values with `sum(is.na(x))`, and drop them with `x[!is.na(x)]`.

- name: data.frame
  usage: data.frame(...)
  does: Builds a table from vectors of the same length. Each vector becomes a column, and each position becomes a row.
  example: data.frame(age = c(67, 54), sbp = c(142, 118))
  result: |2-
      age sbp
    1  67 142
    2  54 118
  introduced: ch07
  note: Every column must be the same length — one value per row. Otherwise it stops with an error.

- name: str
  usage: str(object)
  does: Shows the structure of a data frame — how many rows and columns, and the type of every column. The quickest way to spot a number that's secretly text.
  example: 'str(data.frame(age = c(67, 54), sbp = c("142", "118")))'
  result: |2-
    'data.frame':	2 obs. of  2 variables:
     $ age: num  67 54
     $ sbp: chr  "142" "118"
  introduced: ch07
  note: In a spreadsheet-style view, `142` and `"142"` look identical. `str()` shows the difference — `num` versus `chr`.

- name: summary
  usage: summary(object)
  does: A quick overview — smallest, largest, middle, average, and how many values are missing. On a whole data frame, it does every column at once.
  example: summary(c(118, NA, 131, 156))
  result: |2-
       Min. 1st Qu.  Median    Mean 3rd Qu.    Max.    NA's
      118.0   124.5   131.0   135.0   143.5   156.0       1
  introduced: ch07

- name: nrow
  usage: nrow(x)
  does: Counts the rows in a data frame — how many patients, how many observations.
  example: nrow(data.frame(age = c(67, 54, 71)))
  result: "[1] 3"
  introduced: ch08
  note: After filtering, a count that looks one too high is worth a second look — an `NA` in the filter can add a row of `NA`s.

- name: ifelse
  usage: ifelse(test, yes, no)
  does: Gives one of two values, depending on a question. For each value, `yes` if the test is TRUE, `no` if it's FALSE.
  example: 'ifelse(c(67, 54) >= 65, yes = "65 and over", no = "under 65")'
  result: '[1] "65 and over" "under 65"'
  introduced: ch09
  note: The order is test, then yes, then no. Naming them — `test =`, `yes =`, `no =` — stops the labels ending up backwards.

- name: names
  usage: names(x)
  does: Lists the names of the pieces inside something — the parts of a list, or the columns of a data frame. The quickest way to see what's in a result you don't recognise.
  example: names(t.test(c(128, 134, 121), c(142, 138, 149)))
  result: |2-
     [1] "statistic"   "parameter"   "p.value"     "conf.int"    "estimate"
     [6] "null.value"  "stderr"      "alternative" "method"      "data.name"
  introduced: ch10

- name: t.test
  usage: t.test(x, y, var.equal = FALSE, paired = FALSE, ...)
  does: Compares the means of two groups. Gives back a list you can take the p-value, interval and means out of with `$`.
  example: t.test(c(128, 134, 121, 139), c(142, 138, 149, 135))$p.value
  result: "[1] 0.07970369"
  introduced: ch10
  note: Runs Welch's test unless you set `var.equal = TRUE`. The first two arguments are labelled `x` and `y` in the printout, not by your names. Missing values are dropped without a word.
  note_from: ch11

- name: print
  usage: print(x)
  does: Shows a value. Outside a loop R shows results for you; inside a loop, nothing appears unless something prints it.
  example: print(c(118, 142) - 10)
  result: "[1] 108 132"
  introduced: ch11

- name: install.packages
  usage: install.packages("name")
  does: Downloads a package onto your computer. Needed once per computer, not every session. The name goes in quotes.
  example: install.packages("dplyr")
  result: (downloads and installs dplyr)
  introduced: ch12
  nocheck: true
  note: Without quotes it fails with "object not found", because R looks for a variable of that name.

- name: library
  usage: library(name)
  does: Loads an installed package so you can use its functions. Needed at the start of every session — that's why generated code begins with library() lines.
  example: library(dplyr)
  result: (loads dplyr; may print a message about masked functions)
  introduced: ch12
  nocheck: true
  note: '"there is no package called ..." means it isn''t installed, or the name is misspelled. "could not find function ..." usually means you forgot library().'

- name: filter
  usage: filter(data, condition)
  does: Keeps the rows of a data frame where the condition is TRUE. From dplyr. Inside it, column names are written on their own.
  example: dplyr::filter(data.frame(age = c(67, 54, 71), sbp = c(142, 118, NA)), sbp > 140)
  result: |2-
      age sbp
    1  67 142
  introduced: ch12
  note: Rows where the condition is `NA` are dropped silently — unlike square brackets, which add a row of `NA`s. Without library(dplyr), base R's own filter() runs and gives a misleading error.

- name: mutate
  usage: mutate(data, new_column = calculation)
  does: Adds a column, or changes one, and hands back a new data frame. From dplyr.
  example: dplyr::mutate(data.frame(sbp = c(142, 118), dbp = c(88, 76)), map = (sbp + 2 * dbp) / 3)
  result: |2-
      sbp dbp map
    1 142  88 106
    2 118  76  90
  introduced: ch12
  note: Doesn't change the data frame you gave it. Store the result to keep it — `patients <- mutate(patients, ...)`.

- name: select
  usage: select(data, columns)
  does: Keeps only the columns you name. From dplyr.
  example: dplyr::select(data.frame(age = c(67, 54), sbp = c(142, 118), dbp = c(88, 76)), age, sbp)
  result: |2-
      age sbp
    1  67 142
    2  54 118
  introduced: ch12

- name: sqrt
  usage: sqrt(x)
  does: Square root.
  example: sqrt(2)
  result: "[1] 1.414214"
  introduced: ch05
